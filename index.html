<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Russian Radio - Онлайн Радио России</title>
    <meta name="description" content="Слушайте российские радиостанции онлайн" />
    <meta name="theme-color" content="#7c3aed" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📻</text></svg>" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
    </style>
    <script>
      (function () {
        var reported = {};
        window.addEventListener("error", function (event) {
          if (!event || !event.message) return;
          var key =
            event.message + "|" + (event.filename || "") + "|" + (event.lineno || 0);
          if (reported[key]) return;
          reported[key] = true;
          try {
            if (window.self !== window.top) {
              window.parent.postMessage(
                {
                  type: "sandbox-runtime-error",
                  payload: {
                    message: String(event.message).slice(0, 500),
                    filename: event.filename || "",
                    lineno: event.lineno || 0,
                    colno: event.colno || 0,
                    stack:
                      event.error && event.error.stack
                        ? String(event.error.stack).slice(0, 2000)
                        : ""
                  }
                },
                "*"
              );
            }
          } catch (e) {
            /* ignore */
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
