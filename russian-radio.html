<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>Russian Radio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0a0f, #1a1a2e);
            min-height: 100vh;
            color: white;
            padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 {
            text-align: center;
            font-size: 2rem;
            background: linear-gradient(to right, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle { text-align: center; color: #9ca3af; margin-bottom: 20px; font-size: 0.9rem; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
        .card {
            background: rgba(17, 24, 39, 0.8);
            border-radius: 16px;
            border: 1px solid rgba(75, 85, 99, 0.5);
            padding: 20px;
        }
        .stations { height: 600px; display: flex; flex-direction: column; }
        .filter-bar { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .filter-btn {
            padding: 6px 12px;
            background: #1f2937;
            border: 1px solid #4b5563;
            border-radius: 20px;
            color: #9ca3af;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn:hover, .filter-btn.active {
            background: #7c3aed;
            color: white;
            border-color: #7c3aed;
        }
        input {
            width: 100%;
            padding: 10px;
            background: #1f2937;
            border: 1px solid #4b5563;
            border-radius: 8px;
            color: white;
            margin-bottom: 15px;
        }
        input:focus { outline: none; border-color: #a855f7; }
        .list { flex: 1; overflow-y: auto; }
        .list::-webkit-scrollbar { width: 6px; }
        .list::-webkit-scrollbar-thumb { background: rgba(168, 85, 247, 0.3); border-radius: 3px; }
        .station {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 2px;
            transition: all 0.2s;
        }
        .station:hover { background: #1f2937; }
        .station.active { background: rgba(168, 85, 247, 0.2); border: 1px solid rgba(168, 85, 247, 0.3); }
        .icon {
            width: 36px;
            height: 36px;
            background: #374151;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .info { flex: 1; min-width: 0; }
        .name { font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tags { font-size: 11px; color: #9ca3af; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .badge {
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: 600;
            flex-shrink: 0;
        }
        .badge-record { background: #7c3aed; color: white; }
        .badge-mc { background: #0ea5e9; color: white; }
        .badge-dfm { background: #f59e0b; color: black; }
        .badge-other { background: #374151; color: #9ca3af; }
        .player { display: flex; flex-direction: column; gap: 20px; }
        .player-info { display: flex; align-items: center; gap: 15px; }
        .player-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #9333ea, #ec4899);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            flex-shrink: 0;
        }
        .player-name { font-size: 1.2rem; font-weight: bold; margin-bottom: 4px; }
        .player-tags { font-size: 13px; color: #9ca3af; }
        .controls { display: flex; align-items: center; gap: 15px; }
        button.play-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #9333ea, #ec4899);
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            flex-shrink: 0;
        }
        button.play-btn:hover { transform: scale(1.05); }
        .vol-wrap { display: flex; align-items: center; gap: 8px; flex: 1; }
        input[type="range"] {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            background: #374151;
            border-radius: 2px;
            border: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #a855f7;
            border-radius: 50%;
            cursor: pointer;
        }
        .status { font-size: 12px; color: #6b7280; }
        .status.live { color: #22c55e; }
        .empty { text-align: center; padding: 40px; color: #6b7280; }
        .count { color: #9ca3af; font-size: 14px; margin-bottom: 10px; }
    </style>
</head>

            { id: 208, name: 'Радио Шансон', url: 'https://chanson.hostingradio.ru:8041/shanson128.mp3', tags: 'chanson, russian', group: 'other' },
            { id: 209, name: 'Comedy Radio', url: 'https://comedy.hostingradio.ru/comedy128.mp3', tags: 'pop, humor', group: 'other' },
            { id: 210, name: 'Rock FM', url: 'https://rockfm.hostingradio.ru/rockfm128.mp3', tags: 'rock', group: 'other' },
            { id: 211, name: 'Radio ENERGY', url: 'https://energy.hostingradio.ru/energy128.mp3', tags: 'dance, pop', group: 'other' },
            { id: 212, name: 'Радио Дача', url: 'https://cast.fmprod.ru:8443/radiodacha_256', tags: 'pop, russian', group: 'other' },
            { id: 213, name: 'Новое Радио', url: 'https://cast.fmprod.ru:8443/novoeradio_256', tags: 'pop, russian', group: 'other' },
        ];
        
        let current = null;
        let playing = false;
        let currentFilter = 'all';
        const audio = document.getElementById('audio');
        
        function getBadge(group) {
            switch(group) {
                case 'record': return '<span class="badge badge-record">RECORD</span>';
                case 'montecarlo': return '<span class="badge badge-mc">MC</span>';
                case 'dfm': return '<span class="badge badge-dfm">DFM</span>';
                default: return '<span class="badge badge-other">FM</span>';
            }
        }
        
        function getIcon(group) {
            switch(group) {
                case 'record': return '🟣';
                case 'montecarlo': return '🔵';
                case 'dfm': return '🟡';
                default: return '📻';
            }
        }
        
        function filter() {
            const q = document.getElementById('search').value.toLowerCase();
            return stations.filter(s => {
                const matchFilter = currentFilter === 'all' || s.group === currentFilter;
                const matchSearch = !q || s.name.toLowerCase().includes(q) || s.tags.toLowerCase().includes(q);
                return matchFilter && matchSearch;
            });
        }
        
        function render() {
            const list = filter();
            document.getElementById('count').textContent = list.length + ' / ' + stations.length;
            const container = document.getElementById('list');
            
            if (list.length === 0) {
                container.innerHTML = '<div class="empty">Ничего не найдено</div>';
                return;
            }
            
            container.innerHTML = list.map(s => `
                <div class="station ${current && current.id === s.id ? 'active' : ''}" data-id="${s.id}">
                    <div class="icon">${getIcon(s.group)}</div>
                    <div class="info">
                        <div class="name">${s.name}</div>
                        <div class="tags">${s.tags}</div>
                    </div>
                    ${getBadge(s.group)}
                </div>
            `).join('');
            
            container.querySelectorAll('.station').forEach(el => {
                el.onclick = () => {
                    const id = parseInt(el.dataset.id);
                    const station = stations.find(s => s.id === id);
                    if (station) select(station);
                };
            });
        }
        
        function select(station) {
            current = station;
            render();
            showPlayer();
            play();
        }
        
        function showPlayer() {
            if (!current) return;
            
            document.getElementById('player').innerHTML = `
                <div class="player-info">
                    <div class="player-icon">${getIcon(current.group)}</div>
                    <div style="min-width:0;flex:1">
                        <div class="player-name" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${current.name}</div>
                        <div class="player-tags">${current.tags}</div>
                    </div>
                </div>
                <div class="controls">
                    <button class="play-btn" id="btn">${playing ? '⏸' : '▶'}</button>
                    <div class="vol-wrap">
                        <span style="font-size:12px">🔊</span>
                        <input type="range" id="vol" min="0" max="1" step="0.01" value="${audio.volume}">
                    </div>
                </div>
                <div class="status ${playing ? 'live' : ''}">${playing ? '● LIVE — играет' : '○ Пауза'}</div>
            `;
            
            document.getElementById('btn').onclick = toggle;
            document.getElementById('vol').oninput = (e) => audio.volume = e.target.value;
        }
        
        function play() {
            if (!current) return;
            audio.src = current.url;
            audio.play().then(() => {
                playing = true;
                showPlayer();
            }).catch(err => {
                console.error('Play error:', err);
                // Пробуем через CORS proxy
                audio.src = 'https://corsproxy.io/?' + encodeURIComponent(current.url);
                audio.play().then(() => {
                    playing = true;
                    showPlayer();
                }).catch(() => {
                    alert('Не удалось воспроизвести: ' + current.name);
                });
            });
        }
        
        function toggle() {
            if (playing) {
                audio.pause();
                playing = false;
            } else {
                audio.play();
                playing = true;
            }
            showPlayer();
        }
        
        // Фильтры
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                render();
            };
        });
        
        // Поиск
        document.getElementById('search').oninput = () => render();
        
        // Запуск
        render();
        console.log('✅ Загружено станций:', stations.length);
    </script>
</body>
</html>
