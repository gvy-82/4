<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russian Radio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0a0f, #1a1a2e);
            min-height: 100vh;
            color: white;
            padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 {
            text-align: center;
            font-size: 2rem;
            background: linear-gradient(to right, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle { text-align: center; color: #9ca3af; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
        .card {
            background: rgba(17, 24, 39, 0.8);
            border-radius: 16px;
            border: 1px solid rgba(75, 85, 99, 0.5);
            padding: 20px;
        }
        .stations { height: 500px; display: flex; flex-direction: column; }
        input {
            width: 100%;
            padding: 10px;
            background: #1f2937;
            border: 1px solid #4b5563;
            border-radius: 8px;
            color: white;
            margin-bottom: 15px;
        }
        input:focus { outline: none; border-color: #a855f7; }
        .list { flex: 1; overflow-y: auto; }
        .list::-webkit-scrollbar { width: 6px; }
        .list::-webkit-scrollbar-thumb { background: rgba(168, 85, 247, 0.3); border-radius: 3px; }
        .station {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 4px;
            transition: all 0.2s;
        }
        .station:hover { background: #1f2937; }
        .station.active { background: rgba(168, 85, 247, 0.2); }
        .icon {
            width: 40px;
            height: 40px;
            background: #374151;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        .info { flex: 1; }
        .name { font-weight: 500; margin-bottom: 2px; }
        .tags { font-size: 12px; color: #9ca3af; }
        .player { display: flex; flex-direction: column; gap: 20px; }
        .player-info { display: flex; align-items: center; gap: 15px; }
        .player-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #9333ea, #ec4899);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }
        .player-name { font-size: 1.2rem; font-weight: bold; }
        .controls { display: flex; align-items: center; gap: 15px; }
        button {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #9333ea, #ec4899);
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }
        button:hover { transform: scale(1.05); }
        input[type="range"] {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            background: #374151;
            border-radius: 2px;
            border: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: #a855f7;
            border-radius: 50%;
            cursor: pointer;
        }
        .status { font-size: 12px; color: #6b7280; margin-top: 10px; }
        .empty { text-align: center; padding: 40px; color: #6b7280; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Russian Radio</h1>
        <p class="subtitle">Радиостанции России</p>
        
        <div class="grid">
            <div class="card stations">
                <h3 style="margin-bottom: 15px;">📻 Станции (<span id="count">0</span>)</h3>
                <input type="text" id="search" placeholder="Поиск...">
                <div class="list" id="list">
                    <div class="empty">Загрузка...</div>
                </div>
            </div>
            
            <div class="card player" id="player">
                <div class="empty">Выберите станцию</div>
            </div>
        </div>
    </div>
    
    <audio id="audio"></audio>
    
    <script>
        const stations = [
            { id: 1, name: 'Русское Радио', url: 'https://rusradio.hostingradio.ru/rusradio128.mp3', tags: 'pop' },
            { id: 2, name: 'Европа Плюс', url: 'https://ep256.hostingradio.ru:8052/europaplus256.mp3', tags: 'pop,hit' },
            { id: 3, name: 'Ретро ФМ', url: 'https://retroserver.streamr.ru:8043/retro256.mp3', tags: 'retro' },
            { id: 4, name: 'Наше Радио', url: 'https://nashe1.hostingradio.ru/nashe-256', tags: 'rock' },
            { id: 5, name: 'Радио Рекорд', url: 'https://radiorecord.hostingradio.ru/rr_320.mp3', tags: 'dance' },
            { id: 6, name: 'Авторадио', url: 'https://cast.fmprod.ru:8443/avto_256', tags: 'pop' },
            { id: 7, name: 'Радио Дача', url: 'https://cast.fmprod.ru:8443/radiodacha_256', tags: 'pop' },
            { id: 8, name: 'Love Radio', url: 'https://microitv1.hostingradio.ru:8016/loveradio', tags: 'pop' },
            { id: 9, name: 'Хит FM', url: 'https://hitfm.hostingradio.ru/hitfm128.mp3', tags: 'hit' },
            { id: 10, name: 'DFM', url: 'https://dfm.hostingradio.ru/dfm128.mp3', tags: 'dance' },
            { id: 11, name: 'Радиоmaximum', url: 'https://maximum.hostingradio.ru/maximum128.mp3', tags: 'rock' },
            { id: 12, name: 'Radio Monte Carlo', url: 'https://montecarlo.hostingradio.ru/montecarlo128.mp3', tags: 'lounge' },
            { id: 13, name: 'Радио Шансон', url: 'https://chanson.hostingradio.ru:8041/shanson128.mp3', tags: 'chanson' },
            { id: 14, name: 'Comedy Radio', url: 'https://comedy.hostingradio.ru/comedy128.mp3', tags: 'pop' },
            { id: 15, name: 'Новое Радио', url: 'https://cast.fmprod.ru:8443/novoeradio_256', tags: 'pop' },
            { id: 16, name: 'Радио ENERGY', url: 'https://energy.hostingradio.ru/energy128.mp3', tags: 'dance' },
            { id: 17, name: 'Радио Jazz', url: 'https://cast.fmprod.ru:8443/radiojazz_256', tags: 'jazz' },
            { id: 18, name: 'Rock FM', url: 'https://rockfm.hostingradio.ru/rockfm128.mp3', tags: 'rock' },
            { id: 19, name: 'Радио МИР', url: 'https://cast.fmprod.ru:8443/mir_256', tags: 'pop' },
            { id: 20, name: 'Радио Книга', url: 'https://cast.fmprod.ru:8443/radiokniga_256', tags: 'talk' }
        ];
        
        let current = null;
        let playing = false;
        const audio = document.getElementById('audio');
        
        function render(list) {
            document.getElementById('count').textContent = list.length;
            const container = document.getElementById('list');
            
            if (list.length === 0) {
                container.innerHTML = '<div class="empty">Ничего не найдено</div>';
                return;
            }
            
            container.innerHTML = list.map(s => `
                <div class="station ${current && current.id === s.id ? 'active' : ''}" data-id="${s.id}">
                    <div class="icon">📻</div>
                    <div class="info">
                        <div class="name">${s.name}</div>
                        <div class="tags">${s.tags}</div>
                    </div>
                </div>
            `).join('');
            
            container.querySelectorAll('.station').forEach(el => {
                el.onclick = () => {
                    const id = parseInt(el.dataset.id);
                    const station = stations.find(s => s.id === id);
                    if (station) select(station);
                };
            });
        }
        
        function select(station) {
            current = station;
            render(filter());
            showPlayer();
            play();
        }
        
        function showPlayer() {
            if (!current) return;
            
            document.getElementById('player').innerHTML = `
                <div class="player-info">
                    <div class="player-icon">📻</div>
                    <div>
                        <div class="player-name">${current.name}</div>
                        <div class="tags">${current.tags}</div>
                    </div>
                </div>
                <div class="controls">
                    <button id="btn">${playing ? '⏸' : '▶'}</button>
                    <input type="range" id="vol" min="0" max="1" step="0.01" value="${audio.volume}">
                </div>
                <div class="status">${playing ? '● LIVE' : '○ Пауза'}</div>
            `;
            
            document.getElementById('btn').onclick = toggle;
            document.getElementById('vol').oninput = (e) => audio.volume = e.target.value;
        }
        
        function play() {
            if (!current) return;
            audio.src = current.url;
            audio.play().then(() => {
                playing = true;
                showPlayer();
            }).catch(() => alert('Не удалось воспроизвести'));
        }
        
        function toggle() {
            if (playing) {
                audio.pause();
                playing = false;
            } else {
                audio.play();
                playing = true;
            }
            showPlayer();
        }
        
        function filter() {
            const q = document.getElementById('search').value.toLowerCase();
            if (!q) return stations;
            return stations.filter(s => 
                s.name.toLowerCase().includes(q) || 
                s.tags.toLowerCase().includes(q)
            );
        }
        
        document.getElementById('search').oninput = () => render(filter());
        
        // Запуск
        render(stations);
        console.log('✅ Загружено станций:', stations.length);
    </script>
</body>
</html>
