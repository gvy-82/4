plugins {
    id 'com.android.application'
}

android {
    namespace 'com.russianradio.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.russianradio.app"
        minSdk 14  // Android 4.0 (Ice Cream Sandwich)
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Конфигурация подписывания для Release APK
    signingConfigs {
        release {
            // Раскомментируйте и заполните после создания ключа подписи
            // storeFile file('../release-key.jks')
            // storePassword 'ВАШ_ПАРОЛЬ'
            // keyAlias 'my-key'
            // keyPassword 'ВАШ_ПАРОЛЬ'
        }
    }

    buildTypes {
        debug {
            // Debug APK не требует подписи
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Раскомментируйте после настройки signingConfigs.release
            // signingConfig signingConfigs.release
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
