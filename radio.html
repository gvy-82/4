<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Russian Radio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#0a0a0f,#1a1a2e);min-height:100vh;color:#fff;padding:20px}
.container{max-width:1000px;margin:0 auto}
h1{text-align:center;font-size:2rem;background:linear-gradient(to right,#a855f7,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.subtitle{text-align:center;color:#9ca3af;margin-bottom:20px;font-size:.9rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:768px){.grid{grid-template-columns:1fr}}
.card{background:rgba(17,24,39,.8);backdrop-filter:blur(10px);border-radius:16px;border:1px solid rgba(75,85,99,.5);padding:20px}
.stations{height:600px;display:flex;flex-direction:column}
.filter-bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.filter-btn{padding:6px 12px;background:#1f2937;border:1px solid #4b5563;border-radius:20px;color:#9ca3af;font-size:12px;cursor:pointer;transition:all .2s}
.filter-btn:hover,.filter-btn.active{background:#7c3aed;color:#fff;border-color:#7c3aed}
input[type=text]{width:100%;padding:10px;background:#1f2937;border:1px solid #4b5563;border-radius:8px;color:#fff;margin-bottom:15px}
input[type=text]:focus{outline:none;border-color:#a855f7}
.list{flex:1;overflow-y:auto}
.list::-webkit-scrollbar{width:6px}
.list::-webkit-scrollbar-thumb{background:rgba(168,85,247,.3);border-radius:3px}
.station{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px;transition:all .2s}
.station:hover{background:#1f2937}
.station.active{background:rgba(168,85,247,.2);border:1px solid rgba(168,85,247,.3)}
.icon{width:36px;height:36px;background:#374151;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.info{flex:1;min-width:0}
.name{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{font-size:11px;color:#9ca3af;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:9px;padding:2px 6px;border-radius:10px;font-weight:600;flex-shrink:0}
.badge-record{background:#7c3aed;color:#fff}
.badge-mc{background:#0ea5e9;color:#fff}
.badge-dfm{background:#f59e0b;color:#000}
.badge-other{background:#374151;color:#9ca3af}
.player{display:flex;flex-direction:column;gap:20px}
.player-info{display:flex;align-items:center;gap:15px}
.player-icon{width:60px;height:60px;background:linear-gradient(135deg,#9333ea,#ec4899);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:2rem;flex-shrink:0}
.player-name{font-size:1.2rem;font-weight:bold;margin-bottom:4px}
.player-tags{font-size:13px;color:#9ca3af}
.controls{display:flex;align-items:center;gap:15px}
.play-btn{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#9333ea,#ec4899);border:none;color:#fff;font-size:1.5rem;cursor:pointer;flex-shrink:0}
.play-btn:hover{transform:scale(1.05)}
.vol-wrap{display:flex;align-items:center;gap:8px;flex:1}
input[type=range]{flex:1;height:4px;-webkit-appearance:none;background:#374151;border-radius:2px;border:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:#a855f7;border-radius:50%;cursor:pointer}
.status{font-size:12px;color:#6b7280}
.status.live{color:#22c55e}
.empty{text-align:center;padding:40px;color:#6b7280}
.count{color:#9ca3af;font-size:14px}
</style>
</head>

function sp(){if(!cur)return;document.getElementById('player').innerHTML=`<div class="player-info"><div class="player-icon">${I[cur.g]}</div><div style="min-width:0;flex:1"><div class="player-name" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${cur.n}</div><div class="player-tags">${cur.t}</div></div></div><div class="controls"><button class="play-btn" id="btn">${play?'⏸':'▶'}</button><div class="vol-wrap"><span style="font-size:12px">🔊</span><input type="range" id="vol" min="0" max="1" step="0.01" value="${au.volume}"></div></div><div class="status ${play?'live':''}">${play?'● LIVE — играет':'○ Пауза'}</div>`;document.getElementById('btn').onclick=tg;document.getElementById('vol').oninput=e=>au.volume=e.target.value}
function pl(){if(!cur)return;au.src=cur.u;au.play().then(()=>{play=true;sp()}).catch(()=>{au.src='https://corsproxy.io/?'+encodeURIComponent(cur.u);au.play().then(()=>{play=true;sp()}).catch(()=>alert('Не удалось: '+cur.n))})}
function tg(){if(play){au.pause();play=false}else{au.play();play=true}sp()}
document.querySelectorAll('.filter-btn').forEach(b=>{b.onclick=()=>{document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');filt=b.dataset.filter;r()}});
document.getElementById('search').oninput=()=>r();
r();
